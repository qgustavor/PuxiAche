<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PuxiAche</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2fd6c0">
  <meta name="description" content="PuxiAche — you have just ONE minute: spin the globe and race to find countries before time runs out, competing against other players on the leaderboard. Think fast!">
  <meta property="og:type" content="website">
  <meta property="og:title" content="PuxiAche — race to find countries before time runs out!">
  <meta property="og:description" content="PuxiAche — you have just ONE minute: spin the globe and race to find countries before time runs out, competing against other players on the leaderboard. Think fast!">
  <meta property="og:image" content="https://qgustavor.github.io/PuxiAche/og-en.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PuxiAche — race to find countries before time runs out!">
  <meta name="twitter:description" content="PuxiAche — you have just ONE minute: spin the globe and race to find countries before time runs out, competing against other players on the leaderboard. Think fast!">
  <meta name="twitter:image" content="https://qgustavor.github.io/PuxiAche/og-en.png">
  <script>
    (() => {
      const supported = ['en', 'pt', 'es']
      let lang = 'en'

      try {
        const stored = localStorage.getItem('gd_lang')
        if (supported.includes(stored)) lang = stored
        else {
          const candidates = navigator.languages?.length
            ? navigator.languages
            : [navigator.language]

          for (const candidate of candidates) {
            const short = String(candidate || '').slice(0, 2).toLowerCase()
            if (supported.includes(short)) {
              lang = short
              break
            }
          }
        }
      } catch (_) {
        const short = String(navigator.language || '').slice(0, 2).toLowerCase()
        if (supported.includes(short)) lang = short
      }

      const base = new URL('./', window.location.href)
      window.location.replace(new URL(`${lang}/`, base).href)
    })()
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=./en/">
  </noscript>
</head>
<body>
  <p><a href="./en/">Continue to PuxiAche</a></p>
</body>
</html>
